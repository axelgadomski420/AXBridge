<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>AXBridge</title>
<style>
:root{--bg:#0A0A0F;--surface:#14141F;--surface2:#1E1E2E;--border:#2A2A3E;--text:#F5F5F7;--muted:#8B8B9E;--primary:#8B5CF6;--primary-dark:#7C3AED;--accent:#06B6D4;--success:#10B981;--danger:#EF4444;--radius:18px;--shadow:0 8px 32px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,#1A1030 0%,#0A0A0F 60%);color:var(--text);font-size:16px;line-height:1.5;height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.screen{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.screen.center{align-items:center;justify-content:center;text-align:center}
h1{font-size:32px;font-weight:800;letter-spacing:-.8px;background:linear-gradient(135deg,#fff,#A78BFA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
h2{font-size:22px;font-weight:700;letter-spacing:-.4px}
h3{font-size:17px;font-weight:600}
p{color:var(--muted)}
.caption{font-size:13px;color:var(--muted)}
button{font:inherit;font-weight:600;border:none;border-radius:var(--radius);padding:15px 20px;cursor:pointer;min-height:48px;transition:transform .1s,box-shadow .2s;position:relative}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 20px rgba(139,92,246,.4)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-danger{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff}
.btn-success{background:linear-gradient(135deg,#10B981,#059669);color:#fff}
.btn-full{width:100%}
.btn-icon{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:20px;border-radius:50%}
input,textarea,select{font:inherit;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:var(--text);min-height:48px;transition:border-color .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.card{background:linear-gradient(145deg,rgba(30,30,48,.9),rgba(20,20,32,.9));border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:rgba(15,15,25,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:0;z-index:10}
.topbar h2{flex:1}
.tabs{display:flex;background:rgba(15,15,25,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:10px 4px;font-size:10px;background:transparent;color:var(--muted);border-radius:0;min-height:56px;display:flex;flex-direction:column;gap:3px;align-items:center}
.tabs button.active{color:var(--primary)}
.tabs .icon{font-size:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface2);color:var(--text);font-size:14px;font-weight:500;border:1px solid var(--border);cursor:pointer;min-height:38px}
.chip.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-color:transparent}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;flex-shrink:0}
.avatar.large{width:96px;height:96px;font-size:40px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;margin-bottom:10px;line-height:1.5;word-wrap:break-word;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.user{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.assistant{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg pre{background:rgba(0,0,0,.3);padding:10px;border-radius:8px;overflow-x:auto;font-size:13px;margin:8px 0}
.msg code{background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px;font-size:13px}
.sources{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px}
.sources a{color:var(--accent);text-decoration:none;display:block;margin:4px 0;word-break:break-word}
.typing{display:inline-flex;gap:4px;padding:8px 0}
.typing span{width:8px;height:8px;background:var(--muted);border-radius:50%;animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.input-bar{display:flex;gap:8px;padding:10px 12px;background:rgba(15,15,25,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);align-items:flex-end;flex-shrink:0}
.input-bar textarea{min-height:44px;max-height:120px;padding:11px 15px;border-radius:22px}
.send-btn{width:48px;height:48px;padding:0;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:50%;font-size:18px;flex-shrink:0;box-shadow:0 4px 16px rgba(139,92,246,.4)}
.empty{text-align:center;padding:48px 24px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty-icon{font-size:56px;opacity:.5}
.alert{padding:12px 16px;border-radius:14px;font-size:14px;border:1px solid transparent}
.alert.error{background:rgba(239,68,68,.15);color:#FCA5A5;border-color:rgba(239,68,68,.3)}
.alert.info{background:rgba(6,182,212,.15);color:#67E8F9;border-color:rgba(6,182,212,.3)}
.alert.success{background:rgba(16,185,129,.15);color:#6EE7B7;border-color:rgba(16,185,129,.3)}
.badge{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.video-container{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3}
.video-container video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.gesture-badge{position:absolute;bottom:10px;left:10px;background:rgba(139,92,246,.9);color:#fff;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(30,30,48,.98);color:#fff;padding:12px 22px;border-radius:14px;font-size:14px;z-index:9999;border:1px solid var(--border);box-shadow:var(--shadow)}
audio{width:100%;margin-top:12px;border-radius:12px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// ============================================================
// AXBridge Frontend v2.0
// Konta · AI Chat z wyszukiwarką · Generator muzyki · Migowy
// ============================================================

// ---------- stan ----------
const S = {
  screen: 'auth', // auth | register | login | main
  tab: 'ai', // ai | music | sign | profile
  token: localStorage.getItem('axb_token') || '',
  user: JSON.parse(localStorage.getItem('axb_user') || 'null'),
  aiMessages: [],
  musicSongs: [],
  aiInput: '',
  aiLoading: false,
  musicPrompt: '',
  musicLyrics: '',
  musicLoading: false,
  lastAudioUrl: '',
  signActive: false,
  gestureName: '',
  signHistory: [],
  error: '',
  toast: '',
  form: { email: '', password: '', name: '' },
};

const $ = (h) => (document.getElementById('app').innerHTML = h);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const save = () => {
  localStorage.setItem('axb_token', S.token);
  localStorage.setItem('axb_user', JSON.stringify(S.user));
};
const toast = (m) => { S.toast = m; render(); clearTimeout(window._tt); window._tt = setTimeout(() => { S.toast = ''; render(); }, 2500); };

// ---------- API ----------
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(S.token ? { Authorization: `Bearer ${S.token}` } : {}),
      ...(opts.headers || {}),
    },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function loadHistory() {
  try {
    const d = await api('/api/ai/history');
    S.aiMessages = (d.history || []).map((m) => ({
      role: m.role,
      content: m.content,
      sources: m.sources ? JSON.parse(m.sources) : [],
    }));
    render();
  } catch (_) {}
}

async function loadSongs() {
  try {
    const d = await api('/api/music/list');
    S.musicSongs = d.songs || [];
    render();
  } catch (_) {}
}

async function sendAI() {
  if (!S.aiInput.trim() || S.aiLoading) return;
  const q = S.aiInput.trim();
  S.aiMessages.push({ role: 'user', content: q });
  S.aiInput = '';
  S.aiLoading = true;
  render();
  try {
    const d = await api('/api/ai/chat', { method: 'POST', body: JSON.stringify({ message: q }) });
    S.aiMessages.push({ role: 'assistant', content: d.answer, sources: d.sources });
  } catch (e) {
    S.aiMessages.push({ role: 'assistant', content: `⚠️ ${e.message}` });
  }
  S.aiLoading = false;
  render();
  setTimeout(() => { const el = document.getElementById('ai-end'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 100);
}

async function generateMusic() {
  if (!S.musicPrompt.trim() || S.musicLoading) return;
  S.musicLoading = true;
  S.lastAudioUrl = '';
  render();
  try {
    const d = await api('/api/music/generate', {
      method: 'POST',
      body: JSON.stringify({ prompt: S.musicPrompt, lyrics: S.musicLyrics }),
    });
    S.lastAudioUrl = `/api/music/audio/${encodeURIComponent(d.audioKey)}`;
    toast('🎵 Utwór gotowy!');
    await loadSongs();
  } catch (e) {
    toast(`⚠️ ${e.message}`);
  }
  S.musicLoading = false;
  render();
}

// ---------- MediaPipe (rozpoznawanie gestów) ----------
let gestureRecognizer = null;
let videoEl = null;
let lastGesture = '';

async function initGesture() {
  const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const { GestureRecognizer, FilesetResolver } = vision;
  const fileset = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );
  gestureRecognizer = await GestureRecognizer.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task',
    },
    runningMode: 'VIDEO',
    numHands: 1,
  });
  toast('🤟 Rozpoznawanie gestów gotowe');
}

async function startSignRecognition() {
  if (!gestureRecognizer) {
    try { await initGesture(); } catch (e) { toast('Błąd MediaPipe: ' + e.message); return; }
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    videoEl = document.getElementById('sign-video');
    if (!videoEl) return;
    videoEl.srcObject = stream;
    videoEl.play();
    S.signActive = true;
    render();
    const loop = () => {
      if (!S.signActive || !videoEl || videoEl.readyState < 2) { requestAnimationFrame(loop); return; }
      const res = gestureRecognizer.recognizeForVideo(videoEl, performance.now());
      if (res.gestures && res.gestures.length > 0) {
        const g = res.gestures[0][0];
        if (g.categoryName && g.categoryName !== 'None' && g.score > 0.6 && g.categoryName !== lastGesture) {
          lastGesture = g.categoryName;
          S.gestureName = `${g.categoryName} (${Math.round(g.score * 100)}%)`;
          S.signHistory.unshift({ text: g.categoryName, ts: new Date().toISOString() });
          if (S.signHistory.length > 20) S.signHistory.pop();
          // Wstrzyknij do czatu AI jako wiadomość użytkownika (jeśli chcemy)
          render();
        }
      }
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    toast('Brak dostępu do kamery: ' + e.message);
  }
}

function stopSignRecognition() {
  S.signActive = false;
  if (videoEl && videoEl.srcObject) {
    videoEl.srcObject.getTracks().forEach((t) => t.stop());
    videoEl.srcObject = null;
  }
  render();
}

// ---------- render ----------
function render() {
  let html = '';
  if (S.screen === 'auth') html = renderAuth();
  else if (S.screen === 'register') html = renderRegister();
  else if (S.screen === 'login') html = renderLogin();
  else html = renderMain();
  if (S.toast) html += `<div class="toast">${esc(S.toast)}</div>`;
  $(html);
  if (S.signActive) {
    const v = document.getElementById('sign-video');
    if (v && videoEl && videoEl.srcObject) v.srcObject = videoEl.srcObject;
  }
}

function renderAuth() {
  return `<div class="screen center">
    <div style="font-size:96px;filter:drop-shadow(0 8px 32px rgba(139,92,246,.5))">🌉</div>
    <h1>AXBridge</h1>
    <p style="max-width:320px">Komunikator nowej generacji.<br>AI · Muzyka · Migowy · Wszystko w jednym.</p>
    <button class="btn-primary btn-full" style="margin-top:24px" onclick="S.screen='register';render()">Utwórz konto</button>
    <button class="btn-secondary btn-full" onclick="S.screen='login';render()">Mam już konto</button>
  </div>`;
}

function renderRegister() {
  return `<div class="screen">
    <h2>Utwórz konto</h2>
    ${S.error ? `<div class="alert error">${esc(S.error)}</div>` : ''}
    <div class="field"><label>Pseudonim</label><input value="${esc(S.form.name)}" oninput="S.form.name=this.value" placeholder="Twoje imię"></div>
    <div class="field"><label>E-mail</label><input type="email" value="${esc(S.form.email)}" oninput="S.form.email=this.value"></div>
    <div class="field"><label>Hasło</label><input type="password" value="${esc(S.form.password)}" oninput="S.form.password=this.value"></div>
    <button class="btn-primary btn-full" onclick="doRegister()">Zarejestruj się</button>
    <button class="btn-ghost btn-full" onclick="S.screen='login';render()">Mam konto</button>
  </div>`;
}

function renderLogin() {
  return `<div class="screen">
    <h2>Zaloguj się</h2>
    ${S.error ? `<div class="alert error">${esc(S.error)}</div>` : ''}
    <div class="field"><label>E-mail</label><input type="email" value="${esc(S.form.email)}" oninput="S.form.email=this.value"></div>
    <div class="field"><label>Hasło</label><input type="password" value="${esc(S.form.password)}" oninput="S.form.password=this.value"></div>
    <button class="btn-primary btn-full" onclick="doLogin()">Zaloguj</button>
    <button class="btn-ghost btn-full" onclick="S.screen='register';render()">Nie mam konta</button>
  </div>`;
}

async function doRegister() {
  S.error = '';
  try {
    const d = await api('/api/auth/register', {
      method: 'POST',
      body: JSON.stringify({ email: S.form.email, password: S.form.password, displayName: S.form.name }),
    });
    S.token = d.token;
    S.user = d.user;
    save();
    S.screen = 'main';
    render();
    await Promise.all([loadHistory(), loadSongs()]);
  } catch (e) {
    S.error = e.message;
    render();
  }
}

async function doLogin() {
  S.error = '';
  try {
    const d = await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email: S.form.email, password: S.form.password }),
    });
    S.token = d.token;
    S.user = d.user;
    save();
    S.screen = 'main';
    render();
    await Promise.all([loadHistory(), loadSongs()]);
  } catch (e) {
    S.error = e.message;
    render();
  }
}

function logout() {
  api('/api/auth/logout', { method: 'POST' }).catch(() => {});
  localStorage.removeItem('axb_token');
  localStorage.removeItem('axb_user');
  S.token = '';
  S.user = null;
  S.screen = 'auth';
  render();
}

function renderMain() {
  const tabs = [
    ['ai', '🤖', 'AI Chat'],
    ['music', '🎵', 'Muzyka'],
    ['sign', '🤟', 'Migowy'],
    ['profile', '👤', 'Profil'],
  ];
  let content = '';
  if (S.tab === 'ai') content = renderAI();
  else if (S.tab === 'music') content = renderMusic();
  else if (S.tab === 'sign') content = renderSign();
  else content = renderProfile();
  return `<div style="display:flex;flex-direction:column;height:100%">
    <div style="flex:1;overflow-y:auto">${content}</div>
    <div class="tabs">${tabs.map(([id, ic, lb]) => `<button class="${S.tab === id ? 'active' : ''}" onclick="S.tab='${id}';render()"><span class="icon">${ic}</span><span>${lb}</span></button>`).join('')}</div>
  </div>`;
}

// ---------- AI CHAT ----------
function renderAI() {
  return `<div class="topbar"><h2>🤖 AI Chat</h2><button class="btn-ghost btn-icon" onclick="clearHistory()" title="Wyczyść">🗑️</button></div>
    <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px">
      ${S.aiMessages.length === 0 ? `<div class="empty"><div class="empty-icon">🤖</div><h3 style="color:var(--text)">Zapytaj o cokolwiek</h3><p>Wyszukiwarka + AI w jednym</p></div>` : ''}
      ${S.aiMessages.map((m) => `<div class="msg ${m.role}">${m.role === 'assistant' ? formatAI(m.content) : esc(m.content)}
        ${m.sources && m.sources.length > 0 ? `<div class="sources"><strong>Źródła:</strong>${m.sources.map((src) => `<a href="${src.url}" target="_blank" rel="noopener">📄 ${esc(src.title)}</a>`).join('')}</div>` : ''}
      </div>`).join('')}
      ${S.aiLoading ? `<div class="msg assistant"><div class="typing"><span></span><span></span><span></span></div></div>` : ''}
      <div id="ai-end"></div>
    </div>
    <div class="input-bar"><textarea placeholder="Zapytaj AI…" oninput="S.aiInput=this.value;autoResize(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAI()}">${esc(S.aiInput)}</textarea><button class="send-btn" onclick="sendAI()" ${S.aiLoading ? 'disabled' : ''}>➤</button></div>`;
}

function formatAI(t) {
  let h = esc(t);
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\n/g, '<br>');
  return h;
}

async function clearHistory() {
  if (!confirm('Wyczyścić historię?')) return;
  // można dodać endpoint DELETE, na razie tylko lokalnie
  S.aiMessages = [];
  render();
}

// ---------- MUZYKA ----------
function renderMusic() {
  return `<div class="topbar"><h2>🎵 Generator muzyki</h2></div>
    <div class="screen">
      <div class="card">
        <h3>Opisz utwór</h3>
        <div class="field" style="margin-top:10px"><label>Styl / nastrój / gatunek</label><textarea placeholder="np. indie folk, melancholijny, akustyczna gitara" oninput="S.musicPrompt=this.value">${esc(S.musicPrompt)}</textarea></div>
        <div class="field"><label>Tekst (opcjonalnie)</label><textarea placeholder="[Verse] ... [Chorus] ..." oninput="S.musicLyrics=this.value" style="min-height:60px">${esc(S.musicLyrics)}</textarea></div>
        <button class="btn-primary btn-full" onclick="generateMusic()" ${S.musicLoading ? 'disabled' : ''}>${S.musicLoading ? '⏳ Generuję…' : '🎼 Generuj utwór'}</button>
      </div>
      ${S.lastAudioUrl ? `<div class="card"><h3>Ostatni utwór</h3><audio controls src="${S.lastAudioUrl}"></audio><a href="${S.lastAudioUrl}" download class="btn-secondary btn-full" style="margin-top:10px;text-align:center;text-decoration:none;display:block">⬇️ Pobierz MP3</a></div>` : ''}
      ${S.musicSongs.length > 0 ? `<div class="section-title">Historia</div>${S.musicSongs.map((song) => `<div class="card"><div style="font-weight:600">${esc(song.prompt)}</div><audio controls src="/api/music/audio/${encodeURIComponent(song.audio_url)}" style="margin-top:8px"></audio></div>`).join('')}` : ''}
    </div>`;
}

// ---------- MIGOWY ----------
function renderSign() {
  return `<div class="topbar"><h2>🤟 Rozpoznawanie migowego</h2></div>
    <div class="screen">
      <div class="alert info">MediaPipe rozpoznaje gesty dłoni lokalnie w przeglądarce. Nie wysyła obrazu na serwer.</div>
      <div class="video-container"><video id="sign-video" autoplay muted playsinline style="${S.signActive ? '' : 'display:none'}"></video>${S.signActive ? `<div class="gesture-badge">${esc(S.gestureName) || 'Szukam dłoni…'}</div>` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted)">Kamera wyłączona</div>'}</div>
      <button class="${S.signActive ? 'btn-danger' : 'btn-primary'} btn-full" onclick="${S.signActive ? 'stopSignRecognition()' : 'startSignRecognition()'}">${S.signActive ? '⏹ Zatrzymaj' : '▶️ Włącz kamerę'}</button>
      ${S.signHistory.length > 0 ? `<div class="section-title">Rozpoznane gesty</div>${S.signHistory.map((g) => `<div class="card" style="padding:12px 16px"><span style="font-weight:600">${esc(g.text)}</span><span class="caption" style="float:right">${new Date(g.ts).toLocaleTimeString('pl')}</span></div>`).join('')}` : ''}
    </div>`;
}

// ---------- PROFIL ----------
function renderProfile() {
  const u = S.user || {};
  return `<div class="screen center">
    <div class="avatar large">${esc((u.displayName || '?')[0])}</div>
    <h2>${esc(u.displayName || '')}</h2>
    <p class="caption">${esc(u.email || '')}</p>
    <div style="width:100%;margin-top:24px">
      <div class="list-item" onclick="logout()" style="padding:14px 16px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px"><span style="font-size:20px">🚪</span><span style="flex:1">Wyloguj</span></div>
    </div>
    <p class="caption" style="margin-top:24px">AXBridge v2.0 · Cloudflare Workers AI</p>
  </div>`;
}

function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

// ---------- start ----------
if (S.token && S.user) {
  S.screen = 'main';
  render();
  Promise.all([loadHistory(), loadSongs()]);
} else {
  render();
}

// eksponuj funkcje do onclick
Object.assign(window, {
  S, render, doRegister, doLogin, logout, sendAI, generateMusic,
  startSignRecognition, stopSignRecognition, clearHistory, autoResize, esc, toast,
});
</script>
</body>
</html>
