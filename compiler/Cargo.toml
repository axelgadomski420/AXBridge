[package]
name = "axc"
version = "2.0.0"
edition = "2021"
description = "Kompilator AXCode — jeden plik opisuje dostępną aplikację na każdą platformę."
license = "MIT"

[lib]
name = "axc"
path = "src/lib.rs"

[[bin]]
name = "axc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
