[package]
name = "axc"
version = "0.9.0-ultra"
edition = "2021"
authors = ["AXCode Ultra Team"]
description = "AXCode Ultra Compiler – production compiler for AXBridge-class applications"
license = "MIT"

[[bin]]
name = "axc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
logos = "0.14"
chumsky = "0.9"
ariadne = "0.4"          # beautiful error reporting
petgraph = "0.6"         # for AXIR graphs
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
walkdir = "2"
rayon = "1.10"           # parallel compilation
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.10"
once_cell = "1.19"
indexmap = "2.2"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
