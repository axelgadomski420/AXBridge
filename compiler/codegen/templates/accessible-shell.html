<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{APP_NAME}}</title>
<style>
:root{--scale:{{TEXT_SCALE}};--radius:16px;--ink:#09090B;--paper:#FFFFFF;--muted:#4B4B57;--focus:#1D4ED8}
@media (prefers-color-scheme:dark){:root{--ink:#FAFAFA;--paper:#09090B;--muted:#C4C4CE}}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(100% * var(--scale))}
body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Inter,sans-serif;line-height:1.6}
.screen{max-width:56rem;margin:0 auto;padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
button,input,textarea,select{font:inherit;min-height:48px;min-width:48px;border-radius:var(--radius);padding:.9rem 1.25rem;border:2px solid var(--muted);background:var(--paper);color:var(--ink)}
button{cursor:pointer;font-weight:600}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1{font-size:1.9rem;line-height:1.2}
.caption{color:var(--muted);font-size:.95rem}
.card{border:2px solid var(--muted);border-radius:var(--radius);padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;background:var(--paper);color:var(--ink);padding:.75rem;z-index:10}
.skip:focus{left:0}
[data-reduce-motion=true] *{animation:none!important;transition:none!important}
{%ROOT_STYLE%}
</style>
</head>
<body{%ROOT_ATTRS%}>
<a class="skip" href="#ax-main">Przejdź do treści głównej</a>
<div id="ax-root"></div>
<noscript><p class="screen">Ta aplikacja wymaga JavaScript. Włącz go, aby korzystać z AXBridge.</p></noscript>
<script type="module" src="./ax.app.js"></script>
</body>
</html>
